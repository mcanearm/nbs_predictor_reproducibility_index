[project]
name = "nbs-predictor-mvp"
version = "0.1.0"
description = "Reproducibility index for figures in NBS predictor MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.1.0",
    "dill>=0.4.1",
    "gpytorch>=1.15.2",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "numpyro>=0.21.0",
    "pandas>=3.0.3",
    "properscoring>=0.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "xarray>=2026.4.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
